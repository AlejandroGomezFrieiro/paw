id: one-value-helper
valid:
  - |
    fn is_empty(v: &[u8]) -> bool { v.is_empty() }
  - |
    impl Gain {
        fn is_zero(&self) -> bool { self.0 == 0.0 }
    }
invalid:
  - |
    fn is_zero(v: &f64) -> bool { *v == 0.0 }
  - |
    pub(crate) fn is_false(v: &bool) -> bool { !*v }
  - |
    fn is_one_u32(v: &u32) -> bool { *v == 1 }
