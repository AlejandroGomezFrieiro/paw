id: comment-bash
language: Bash
severity: warning
message: A comment that is not the usage header of the script.
note: Delete it. What a reader needs goes in the header at the top of the file.
rule:
  kind: comment
  not:
    any:
      - regex: '^#!'
      - regex: '(SAFETY:|SPDX-License-Identifier|Copyright|shellcheck |luacheck:|stylua:|rustfmt::|noqa|type: ignore|prettier-ignore|eslint-|@ts-|fmt: (off|on))'
      - all:
          - inside:
              kind: program
          - not:
              follows:
                not:
                  kind: comment
                stopBy: end
