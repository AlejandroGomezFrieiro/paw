project_name: "paw"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "nvim"
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: true
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
definition_of_done:
  - "Each acceptance criterion is met, and the notes give its evidence"
  - "Tests: each change of behavior has a test (real keys for a UX change); tests are sealed and do not depend on time; prune-tests is applied"
  - "Checks pass: clippy 0 warnings, tlcheck, luacheck, fmtcheck, testlint, layers, apidoc check, Vale 0 alerts on changed Markdown"
  - "Docs: each page the change made untrue is fixed; the notes give the stale-docs search; generated files are generated, not edited"
  - "Architecture: a contract change is in the architecture documentation; a design change has a proposed ADR"
  - "Report: it starts with Changes for the orchestrator (file, place, exact edit), then commits, evidence, tests to run after the build, before and after screens for a UX change, owner questions"
  - "Hygiene: no ticket ids or backlog paths in tracked files; commit trailer; no process left running; paw-gui not touched"
  - "Orchestrator: merged on main; affected tests and the full suite pass; the changes for the orchestrator are applied"
