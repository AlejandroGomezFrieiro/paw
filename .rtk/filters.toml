schema_version = 1

[filters.paw-suite]
description = "paw Lua suite under nextest: drop the lines of passing and starting tests"
match_command = "(^|/)tests/tools/suite\\.sh\\b"
strip_ansi = true
strip_lines_matching = ["^\\s*$", "^\\s*(PASS|START|SLOW) \\["]

[[tests.paw-suite]]
name = "keeps failures and the summary"
input = "    START [ 0/2] lua::a\n        PASS [   0.4s] lua::a\n        FAIL [   0.9s] lua::b\nassertion: want 1, got 2\n\n     Summary [   1.0s] 2 tests run: 1 passed, 1 failed"
expected = "        FAIL [   0.9s] lua::b\nassertion: want 1, got 2\n     Summary [   1.0s] 2 tests run: 1 passed, 1 failed"
