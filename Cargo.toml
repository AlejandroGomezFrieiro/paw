[workspace]
resolver = "2"
members = ["crates/*"]
# The window (paw-gui) is paused while the work is on the terminal: a plain
# `cargo build`, `cargo check` or `cargo test` at the top does not build it.
# `-p paw-gui` still builds it.
default-members = [
  "crates/paw-core",
  "crates/paw-engine",
  "crates/paw-listen",
  "crates/paw-luadev",
  "crates/paw-mcp",
  "crates/paw-plugins",
  "crates/paw-proto",
  "crates/paw-raster",
  "crates/paw-scene",
  "crates/paw-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Without their sound devices: paw-core, paw-tui and the window add them
# where the machine has them (not in a BrowserPod pod, web/browserpod/README.md).
paw-engine = { path = "crates/paw-engine", default-features = false }
paw-core = { path = "crates/paw-core" }
paw-plugins = { path = "crates/paw-plugins" }
paw-luadev = { path = "crates/paw-luadev" }
paw-proto = { path = "crates/paw-proto" }
paw-listen = { path = "crates/paw-listen", default-features = false }
paw-raster = { path = "crates/paw-raster" }
paw-scene = { path = "crates/paw-scene" }
anyhow = "1"
# Typed errors where a caller tells one failure from another. Already in
# Cargo.lock through other crates.
thiserror = "2"
# Small vectors on the stack (the text that Lua draws, paw-core's
# api/mod.rs). Already in Cargo.lock through other crates.
smallvec = "1"
# Sets of flags as types (faults, sandbox states). Already in Cargo.lock
# through other crates.
bitflags = "2"
serde = { version = "1", features = ["derive", "rc"] }
# Exact round trips of every f64 through a saved project.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Command lines of the binaries.
clap = { version = "4", features = ["derive"] }
# I/O that waits (paw-crates.md): each crate adds the features it uses.
tokio = { version = "1", default-features = false }
# Bytes as hexadecimal digits: digests, fingerprints, plugin ids.
hex = "0.4"
# Memory maps of files and anonymous memory (paw-crates.md). Already in
# Cargo.lock through other crates.
memmap2 = "0.9"
# BLAKE3 content hashes of files (media/hash.rs): SIMD, and parallel with mmap
# and rayon for big files. ring stays for SHA-256 where it is used.
blake3 = { version = "1", default-features = false, features = ["std", "mmap", "rayon"] }
# TLS for network connections, pure Rust with ring: no OpenSSL.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# TLS on tokio's sockets (the network server, paw-core's rpc.rs), over the
# rustls above: no provider of its own.
tokio-rustls = { version = "0.26", default-features = false }
# Golden files for the text formats, in tests only (.claude/skills/rust-testing,
# part 5): `json` for assert_json_snapshot!, `filters` to hide the paths of a
# test's folder. The lock keeps the version of `cargo insta` in the dev shell,
# which reads and accepts them (`cargo insta review`).
insta = { version = "1.47", features = ["json", "filters"] }

# Property tests, a dev-dependency only: a strategy makes the inputs from a
# seed, and a failure is shrunk and kept in `proptest-regressions/`. Without
# `fork` and `timeout`: a property runs in the process of its test.
proptest = { version = "1.11", default-features = false, features = ["std"] }

[profile.dev]
opt-level = 1
# Backtraces keep their file and line; full debug info for every crate is
# what makes `target/debug` tens of gigabytes.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"

# `cargo build --profile profiling`: the release build with line tables and
# symbols, for perf, samply and heaptrack (bench/profile.md).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
