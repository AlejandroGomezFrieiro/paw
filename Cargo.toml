[workspace]
resolver = "2"
members = ["crates/*", "fuzz"]
# The window (paw-gui) is paused while the work is on the terminal: a plain
# `cargo build`, `cargo check` or `cargo test` at the top does not build it.
# `-p paw-gui` still builds it. Nor does it build the fuzz targets
# (`fuzz/`, cargo-fuzz on nightly Rust): `cargo check -p paw-fuzz` checks
# them on stable, and tools/fuzz.sh runs them.
default-members = [
  "crates/chain-lsp",
  "crates/chain-syntax",
  "crates/paw-core",
  "crates/paw-engine",
  "crates/paw-listen",
  "crates/paw-luadev",
  "crates/paw-mcp",
  "crates/paw-measure",
  "crates/paw-plugins",
  "crates/paw-proto",
  "crates/paw-raster",
  "crates/paw-scene",
  "crates/paw-tui",
  "crates/paw-types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# The toolchain of the flake. No check builds with an older one, so this is
# the oldest version that paw is known to build with.
rust-version = "1.95"

# Each crate takes these with `[lints] workspace = true`. Each lint is a
# warning: a build does not fail on one, and `cargo clippy` shows all.
[workspace.lints.rust]
# A `pub` item that no other crate can reach: write `pub(crate)`, so that the
# interface of a crate is what its callers use and dead code shows.
unreachable_pub = "warn"
# A BrowserPod pod is the target vendor `browserpod`
# (web/browserpod/README.md): paw-core, paw-engine and paw-tui test it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("browserpod"))'] }

[workspace.lints.clippy]
# The default groups (correctness, suspicious, style, complexity, perf) stay
# on. `lock().unwrap()` stays: a poisoned lock means that a thread panicked,
# and the panic goes on.
# Each `unsafe` block says why it is sound in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
# A function longer than 100 lines (clippy.toml) is split into named steps.
too_many_lines = "warn"
# Bool flags in a struct or in the arguments: an enum or a bitflags says
# which flag is set.
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"
# An `allow` or `expect` says why.
allow_attributes_without_reason = "warn"
# `unwrap` in production code: `?`, or `expect` with the invariant. Tests
# may unwrap (clippy.toml). `lock().unwrap()` gets an `expect`.
unwrap_used = "warn"
redundant_clone = "warn"
match_same_arms = "warn"
# `&x as *const _`: `&raw const x` or `ptr::from_ref`.
borrow_as_ptr = "warn"

[workspace.dependencies]
# Without their sound devices: paw-core, paw-tui and the window add them
# where the machine has them (not in a BrowserPod pod, web/browserpod/README.md).
paw-engine = { path = "crates/paw-engine", default-features = false }
paw-core = { path = "crates/paw-core" }
paw-plugins = { path = "crates/paw-plugins" }
paw-luadev = { path = "crates/paw-luadev" }
paw-measure = { path = "crates/paw-measure" }
paw-proto = { path = "crates/paw-proto" }
paw-listen = { path = "crates/paw-listen", default-features = false }
paw-raster = { path = "crates/paw-raster" }
paw-scene = { path = "crates/paw-scene" }
# The chain language, generic: it depends on no paw crate.
chain-syntax = { path = "crates/chain-syntax" }
# The value types of the model and the engine: builds for wasm32.
paw-types = { path = "crates/paw-types" }
anyhow = "1"
# Typed errors where a caller tells one failure from another. Already in
# Cargo.lock through other crates.
thiserror = "2"
# Small vectors on the stack (the text that Lua draws, paw-core's
# api/mod.rs). Already in Cargo.lock through other crates.
smallvec = "1"
# Sets of flags as types (faults, sandbox states). Already in Cargo.lock
# through other crates.
bitflags = "2"
serde = { version = "1", features = ["derive", "rc"] }
# Exact round trips of every f64 through a saved project.
serde_json = { version = "1", features = ["float_roundtrip"] }
# JSON Schemas of typed structs: the shapes of paw.api (Teal records) and
# the parameters of built-in kinds (ParamSchema), and paw-mcp's tool
# inputs. Already in Cargo.lock through rmcp.
schemars = "1"
# Command lines of the binaries.
clap = { version = "4", features = ["derive"] }
# I/O that waits (paw-crates.md): each crate adds the features it uses.
tokio = { version = "1", default-features = false }
# Bytes as hexadecimal digits: digests, fingerprints, plugin ids.
hex = "0.4"
# Memory maps of files and anonymous memory (paw-crates.md). Already in
# Cargo.lock through other crates.
memmap2 = "0.9"
# BLAKE3 content hashes of files (media/hash.rs): SIMD, and parallel with mmap
# and rayon for big files. ring stays for SHA-256 where it is used.
blake3 = { version = "1", default-features = false, features = ["std", "mmap", "rayon"] }
# A walk of a folder tree (the plugin folders). Already in Cargo.lock
# through other crates.
walkdir = "2"
# TLS for network connections, pure Rust with ring: no OpenSSL.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# TLS on tokio's sockets (the network server, paw-core's rpc.rs), over the
# rustls above: no provider of its own.
tokio-rustls = { version = "0.26", default-features = false }
# Golden files for the text formats, in tests only (.claude/skills/rust-testing,
# part 5): `json` for assert_json_snapshot!, `filters` to hide the paths of a
# test's folder. The lock keeps the version of `cargo insta` in the dev shell,
# which reads and accepts them (`cargo insta review`).
insta = { version = "1.47", features = ["json", "filters"] }

# Property tests, a dev-dependency only: a strategy makes the inputs from a
# seed, and a failure is shrunk and kept in `proptest-regressions/`. Without
# `fork` and `timeout`: a property runs in the process of its test.
proptest = { version = "1.11", default-features = false, features = ["std"] }

[profile.dev]
opt-level = 1
# Backtraces keep their file and line; full debug info for every crate is
# what makes `target/debug` tens of gigabytes.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"

# `cargo build --profile profiling`: the release build with line tables and
# symbols, for perf, samply and heaptrack (bench/profile.md).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
