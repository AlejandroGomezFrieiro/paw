[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
paw-engine = { path = "crates/paw-engine" }
paw-core = { path = "crates/paw-core" }
paw-plugins = { path = "crates/paw-plugins" }
paw-luadev = { path = "crates/paw-luadev" }
paw-proto = { path = "crates/paw-proto" }
paw-listen = { path = "crates/paw-listen" }
paw-raster = { path = "crates/paw-raster" }
paw-scene = { path = "crates/paw-scene" }
anyhow = "1"
# Typed errors where a caller tells one failure from another. Already in
# Cargo.lock through other crates.
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
# Exact round trips of every f64 through a saved project.
serde_json = { version = "1", features = ["float_roundtrip"] }
# TLS for network connections, pure Rust with ring: no OpenSSL.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.dev]
opt-level = 1
# Backtraces keep their file and line; full debug info for every crate is
# what makes `target/debug` tens of gigabytes.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
