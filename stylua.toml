# StyLua's configuration for the Lua files, as close to paw's style as
# StyLua goes: two spaces, lines up to 120 columns, double quotes, short
# statements kept on one line, requires in the order they are written.
# The tree is not formatted with it: StyLua would change most files,
# because it cannot keep comments aligned after code, or two short
# statements on one line. The flake's `format` check says how much, and
# does not fail.
syntax = "All"
column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Input"
collapse_simple_statement = "Always"
space_after_function_names = "Never"

[sort_requires]
enabled = false
