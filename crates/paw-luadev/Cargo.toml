[package]
name = "paw-luadev"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Devices written in Lua, each run in a LuaJIT state of its own."

[dependencies]
paw-engine.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
# The same features as the kernel's, so that both share one build of LuaJIT.
mlua = { version = "0.12", features = ["luajit", "vendored", "serde"] }
