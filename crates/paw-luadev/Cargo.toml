[package]
name = "paw-luadev"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Devices written in Lua, each run in a LuaJIT state of its own."

[dependencies]
paw-engine.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The same features as the kernel's, so that both share one build of Lua.
[target.'cfg(not(target_vendor = "browserpod"))'.dependencies]
mlua = { version = "0.12", features = ["luajit", "vendored", "serde"] }

[target.'cfg(target_vendor = "browserpod")'.dependencies]
mlua = { version = "0.12", features = ["lua52", "vendored", "serde"] }

[lints]
workspace = true
