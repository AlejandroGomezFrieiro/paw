[package]
name = "paw-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A graphical frontend, drawn with egui. It talks to the kernel over its control socket."

[dependencies]
anyhow.workspace = true
clap.workspace = true
paw-proto.workspace = true
# The machine's sound device, to hear an instance here.
paw-listen = { workspace = true, features = ["device"] }
paw-raster.workspace = true
paw-scene.workspace = true
serde_json.workspace = true
libc = "0.2"
unicode-width = "0.2"
# OpenGL through glow: it runs on any driver, Mesa's llvmpipe too, so the
# window needs no graphics card. X11 and Wayland, and the clipboard. The
# window's own loop (src/runner.rs) in place of eframe's: it draws again
# only what changed. Not egui's own fonts (one is under the Ubuntu font
# licence): the window brings its own.
egui = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false, features = ["x11", "wayland", "clipboard"] }
egui_glow = { version = "0.37", default-features = false }
glutin = { version = "0.32.3", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
glutin-winit = { version = "0.5.0", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
# The icons are SVG paths: read with kurbo, filled with tiny-skia.
kurbo = "0.13"
tiny-skia = "0.12"
# To try a font of the system's with the parser egui draws with.
skrifa = "0.44"
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }

[dev-dependencies]
egui_kittest = "0.37"
