[package]
name = "paw-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hosts CLAP, LV2 and VST3 plugins as engine devices."

[dependencies]
paw-engine.workspace = true
anyhow.workspace = true
bitflags.workspace = true
hex.workspace = true
rtrb = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap-sys = "0.5"
# Safe wrappers over clap-sys for the CLAP host: the entry and the plugin
# factory so far (clap.rs). paw opens the file itself (libs.rs), so not
# Clack's own loader.
clack-host = { version = "0.2", default-features = false }
lilv-sys = "0.3"
vst3 = "0.3"
libloading = "0.8"
libc = "0.2"
# Safe Unix calls for the plugin sandbox: memfd, mmap, futex, kill, prctl.
rustix = { version = "1", features = ["fs", "mm", "param", "process", "thread"] }
x11rb = "0.13"

[dev-dependencies]
hound = "3.5"

# A CLAP plugin of the tests' own (tests/stub.rs).
[[example]]
name = "stub_clap"
crate-type = ["cdylib"]
