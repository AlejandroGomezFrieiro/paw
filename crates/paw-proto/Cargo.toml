[package]
name = "paw-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client's side of the kernel's control protocol, TLS included."

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
rustls.workspace = true
# The connection's I/O, on one runtime thread for the process.
tokio = { workspace = true, features = ["rt", "net", "io-util", "time"] }
tokio-rustls.workspace = true
base64 = "0.22"
hex.workspace = true
# SHA-256 for proofs and fingerprints, at the version rustls links.
ring = "0.17"

[dev-dependencies]
insta.workspace = true
tempfile = "3"

[lints]
workspace = true
