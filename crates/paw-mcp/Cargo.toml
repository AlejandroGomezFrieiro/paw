[package]
name = "paw-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A Model Context Protocol server in front of the kernel's control socket."

[[bin]]
name = "paw-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# The folders and the default socket, as the kernel finds them.
paw-proto.workspace = true
# The measurements, shared with the kernel's paw.api.measure.
paw-measure.workspace = true
serde_json.workspace = true
arrayvec = "0.7"
hound = "3.5"
rustix = { version = "1", default-features = false, features = ["std", "net", "process"] }
include_dir = "0.7"
serde.workspace = true
# The command line.
clap.workspace = true
# The MCP protocol: the official Rust SDK, its server and stdio transport.
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
# rmcp's runtime, which also carries the kernel's socket and process.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "io-std", "process", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
