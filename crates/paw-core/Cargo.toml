[package]
name = "paw-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The kernel: project model, engine sync, Lua host, cell grid, event loop, RPC."

[dependencies]
paw-types.workspace = true
paw-engine.workspace = true
paw-luadev.workspace = true
paw-measure.workspace = true
paw-proto.workspace = true
paw-raster.workspace = true
paw-scene.workspace = true
# The chain language: the schema of paw's kinds (`paw chain schema`).
chain-syntax.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
smallvec.workspace = true
include_dir = "0.7"
unicode-width = "0.2"
base64 = "0.22"
# deflate, zlib and gzip for paw.api.inflate/deflate (zip, gzip and zlib in extensions).
flate2 = "1"
# project.toml, the settings of a project folder.
toml = "1.1"
# paw.api.toml_decode/toml_encode: TOML that keeps the order of its keys.
toml_edit = "0.25"
# paw.api.xml_decode/xml_encode, for the XML of other programs.
quick-xml = "0.41"
rtrb = "0.4"
libc = "0.2"
# The path of a .trashinfo record (fs_api.rs).
percent-encoding = "2.3"
# Pure Rust FLAC encoder, for renders to .flac.
flacenc = { version = "0.5", default-features = false }
# Band-limited sample-rate conversion of sound files (resample.rs).
rubato = "5"
# FFTs for the phase vocoder that stretches clips (stretch.rs).
realfft = "3.5"
# A fast hash for the sync's maps of clips and of compiled events (sync/clips.rs).
rustc-hash = "2.1"
# Content hashes of source files (media/hash.rs).
blake3.workspace = true
rustls.workspace = true
# I/O that waits (io_runtime.rs): the control socket and the network
# server (rpc.rs) and the output of helper processes (io.rs), on one thread.
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync", "macros", "process"] }
# poll(2), for a write to a helper process or a socket to wait for room (io.rs).
rustix = { version = "1", default-features = false, features = ["std", "event", "fs", "process"] }
tokio-rustls.workspace = true
# The self-signed certificate an instance listening on the network shows.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

# LuaJIT, and the sound devices and MIDI ports of the machine. Not in a
# BrowserPod pod (target_vendor "browserpod"): LuaJIT cannot run in
# WebAssembly, and a pod has no sound device (web/browserpod/README.md).
[target.'cfg(not(target_vendor = "browserpod"))'.dependencies]
mlua = { version = "0.12", features = ["luajit", "vendored", "serde"] }
paw-engine = { workspace = true, features = ["cpal", "midi"] }

# In a pod: PUC Lua 5.2, which has LuaJIT's numbers (runtime/lua/paw/portable.lua).
[target.'cfg(target_vendor = "browserpod")'.dependencies]
mlua = { version = "0.12", features = ["lua52", "vendored", "serde"] }

[build-dependencies]
# Compiles the Lua runtime to bytecode (build.rs), with the LuaJIT the
# program runs it on.
mlua = { version = "0.12", features = ["luajit", "vendored"] }

[dev-dependencies]
insta.workspace = true
tempfile = "3"
proptest.workspace = true

[[bench]]
name = "nest_expand"
harness = false

[lints]
workspace = true
