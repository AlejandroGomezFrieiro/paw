[package]
name = "paw-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Real-time audio engine: tracks, devices, clips, transport. Knows nothing about Lua or UI."

[features]
default = ["cpal", "midi"]
midi = ["dep:alsa-sys"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
rtrb = "0.4"
# Atomic f32 and f64 for meters and positions: plain loads and stores of the
# bits, as `AtomicU32`/`AtomicU64` with `from_bits`, no lock.
atomic_float = "1.1"
realfft = "3.5"
hound = "3.5"
# Pure Rust, so the Nix build needs no codec libraries. Only what audio clips use.
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "pcm", "adpcm", "flac", "mpa", "ogg", "vorbis", "all-meta"] }
cpal = { version = "0.18", optional = true, features = ["pipewire"] }
# The sequencer is used through the raw bindings: MIDI 2.0 clients and
# Universal MIDI Packets are not in the safe wrapper.
alsa-sys = { version = "0.4", optional = true }
# Thread priorities for the worker pool, and the sequencer's poll.
libc = "0.2"
bitflags.workspace = true
# Decoded sound in files of the cache, and room for sound being made.
memmap2.workspace = true
# The sequencer's poll.
rustix = { version = "1", default-features = false, features = ["std", "event", "process"] }

[dev-dependencies]
serde_json.workspace = true
rtrb = "0.4"
alsa-sys = "0.4"
