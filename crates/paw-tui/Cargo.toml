[package]
name = "paw-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal frontend and the `paw` binary."

[[bin]]
name = "paw"
path = "src/main.rs"

[dependencies]
paw-core.workspace = true
paw-proto.workspace = true
paw-engine.workspace = true
paw-luadev.workspace = true
paw-plugins.workspace = true
paw-listen.workspace = true
paw-raster.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
crossterm = "0.29"
# dup and dup2 of stderr in main.rs.
# The terminal's settings, the poll of /dev/tty, and the writes of the
# signal handler.
rustix = { version = "1", default-features = false, features = ["std", "event", "stdio", "termios"] }
# The SIGTERM and SIGHUP handler that gives the terminal back.
signal-hook = { version = "0.3", default-features = false }

[dev-dependencies]
paw-scene.workspace = true
libc = "0.2"
