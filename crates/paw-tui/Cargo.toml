[package]
name = "paw-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Terminal frontend and the `paw` binary."

[[bin]]
name = "paw"
path = "src/main.rs"

[dependencies]
paw-core.workspace = true
paw-proto.workspace = true
paw-engine.workspace = true
paw-luadev.workspace = true
paw-listen.workspace = true
paw-raster.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
crossterm = "0.29"
# dup and dup2 of stdout and stderr in stdio.rs.
# The terminal's settings, the poll of /dev/tty, and the writes of the
# signal handler.
rustix = { version = "1", default-features = false, features = ["std", "event", "stdio", "termios"] }
# The SIGTERM and SIGHUP handler that gives the terminal back.
signal-hook = { version = "0.3", default-features = false }

# Plugins, and the sound devices of the machine. A BrowserPod pod has
# neither (web/browserpod/README.md).
[target.'cfg(not(target_vendor = "browserpod"))'.dependencies]
paw-plugins.workspace = true
paw-listen = { workspace = true, features = ["device"] }

# The global allocator of the native binary (main.rs): the C source is in
# the crate and builds with cc, so no system library. mimalloc 3 (the
# crate's default; `v2` selects the old one). A BrowserPod pod (target
# family `unix`, vendor `browserpod`) and a WebAssembly build keep the
# system allocator.
[target.'cfg(not(any(target_family = "wasm", target_vendor = "browserpod")))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
paw-scene.workspace = true
libc = "0.2"
# `paw chain schema` writes a schema that the chain language reads (tests/chain.rs).
chain-syntax.workspace = true
[lints]
workspace = true
