[package]
name = "paw-listen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Plays an instance's sound on the machine a terminal or window is attached from."

[features]
default = ["device"]
device = ["dep:cpal"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
paw-proto.workspace = true
# The WAV file that the null device writes.
hound = "3.5"
cpal = { version = "0.18", optional = true, features = ["pipewire"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
