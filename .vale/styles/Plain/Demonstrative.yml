# plain-writing rule 24: no vague demonstrative pronouns. Do not open a
# sentence (and so a paragraph) with "This", "That", "These" or "Those":
# name the thing.
extends: existence
message: "Do not open a sentence with '%s' (plain-writing 24). Name the thing."
level: warning
scope: sentence
raw:
  - '^(?:This|That|These|Those)\b'
