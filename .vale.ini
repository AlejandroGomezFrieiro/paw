# Vale checks paw's documentation: tools/vale.sh docs README.md ...
# (StylesPath comes from tools/vale.sh: the styles packaged by Nix and the
# project's own in .vale/styles.)
#
# - STE: ASD-STE100 Simplified Technical English (.vale/styles/STE).
# - Plain: the rules of the plain-writing skill that a pattern can check
#   (.vale/styles/Plain, .claude/skills/plain-writing).
# - Readability: grade-level scores for internal text (STE: grade 8 or less).
# - write-good: weasel words, wordiness, cliches.
# - alex: inclusive language.
# - AiTells: patterns of machine-written prose (stock phrases, hidden verbs,
#   "not just X, but Y", vague link text, dashes).
# - Vale: spelling, repeated words, and the Paw vocabulary.
#
# Every rule is an error or off. There is no warning level: an alert is a
# fault to fix, never a note to ignore. The packaged styles ship some rules
# at warning or suggestion level, so each rule gets its level here. A new
# rule of a package is then a visible choice.
#
# Three kinds of file, and one that is not checked:
#
# - External: README.md, docs/**, the READMEs and doc/ pages of the
#   extensions, the READMEs of the crates and of web/. Plain writing (the Plain style,
#   AiTells, alex, write-good, spelling), plus the STE rules that agree
#   with it. Readability is off.
# - Generated: docs/reference/api.md (tools/apidoc.lua, from doc comments)
#   and docs/tutorials/course/* (from the tutor's lessons). They follow
#   the external rules too. Nobody edits them: a fix goes into the doc
#   comment or the lesson, and the generator writes the page again. The
#   suite compares each page with the generator's output, so Vale on the
#   page checks the source.
# - Internal: AGENTS.md, .claude/**, bench/*.md, and architecture/** (the
#   architecture documentation: local to the owner's machine, not in git,
#   see .claude/skills/architecture). STE, with the grade levels.
# - bench/RESULTS.md: a dated log of measurements. Not checked.
#
# The sections match the path relative to the root, and tools/vale.sh makes
# each path relative. A later section that matches a file replaces
# BasedOnStyles and keeps the rule settings of the sections before it. A
# path that matches no kind gets the external rules ([*.md]).
MinAlertLevel = suggestion
Vocab = Paw

# The rule levels for every kind, and the external rules as the default.
[*.md]
BasedOnStyles = Vale, Plain, write-good, alex, AiTells
STE.Spelling = YES
STE.Glossary = YES
STE.PassiveBy = YES
STE.Paragraphs = YES

# Code spans and fenced code are skipped by Vale. Also skip key names in
# <kbd>, HTML comments with tags, and Markdown link targets.
TokenIgnores = (<kbd>[^<]*</kbd>), (<!--[^>]*-->)

# Vale: spelling and repeated words. The vocabulary is for spelling only;
# case is free ("paw" and "Paw").
Vale.Spelling = error
Vale.Repetition = error
Vale.Terms = NO
Vale.Avoid = NO

# STE's procedure limit (20 words) applies to steps, not to descriptions:
# it is off for each file.
STE.ProcedureLength = NO

# Grade levels are averages over a page. Internal files only (below).
Readability.FleschKincaid = error
Readability.GunningFog = error
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.SMOG = NO
Readability.LIX = NO
Readability.FleschReadingEase = NO
Readability.Polysyllables = NO

# write-good. STE checks the passive and "be" forms itself, more precisely.
# STE wants connecting words ("So", "Then") and plain phrases ("if it is
# possible"). "several" is a plain word (STE.Words lists the weasel words).
write-good.Cliches = error
write-good.Illusions = error
write-good.ThereIs = error
write-good.Passive = NO
write-good.E-Prime = NO
write-good.So = NO
write-good.TooWordy = NO
write-good.Weasel = NO

# alex. Words of music and of Vim are not slurs here: the master track, an
# envelope's attack, `y` to yank.
alex.Ablist = error
alex.Condescending = error
alex.Gendered = error
alex.LGBTQ = error
alex.OCD = error
alex.Press = error
alex.Suicide = error
alex.ProfanityUnlikely = NO
alex.ProfanityLikely = NO
alex.ProfanityMaybe = NO
alex.Race = NO

# AiTells: patterns of machine-written prose. Three rules are off. Passive:
# STE.PassiveBy checks the passive, and plain-writing allows it when the
# actor is unknown. Adverb: "exactly" and "only" often carry a fact of the
# program ("exactly one track"). EpigramContrast: "is written, not played"
# states a fact about behavior; Plain.NegParallel finds the real pattern.
AiTells.AbstractTriad = error
AiTells.Adverb = NO
AiTells.Cliche = error
AiTells.CodeToken = error
AiTells.CopulaInflation = error
AiTells.Dash = error
AiTells.EpigramContrast = NO
AiTells.FilePath = error
AiTells.HiddenVerb = error
AiTells.LinkText = error
AiTells.NegParallel = error
AiTells.NeverTag = error
AiTells.Passive = NO
AiTells.SectionCode = error
AiTells.StatusBracket = error
AiTells.VirtueHonest = error
AiTells.WeakResume = error

# External pages: plain-writing. The STE rules that agree with it stay:
# American spelling, paw's names for things (rule 4 of the skill), the
# active voice when the actor is known, short paragraphs. The STE rules
# that fight it go: contractions (rule 5 allows them), the sentence and
# step lengths (rule 12 wants long, explanatory sentences), semicolons
# (rule 9 allows them between steps), the -ing, continuous and present
# perfect forms, phrasal verbs ("set up" is the everyday word), and
# STE.Words (the skill writes "e.g.", "moreover" and "whether";
# Plain.PlainWords keeps the swaps that agree). Readability goes too: its
# grade levels punish long sentences.
[{README.md,docs/**/*.md,crates/*/README.md,extensions/*/README.md,extensions/*/doc/**/*.md,web/*/README.md}]
BasedOnStyles = Vale, Plain, write-good, alex, AiTells
Readability.FleschKincaid = NO
Readability.GunningFog = NO

# Generated pages: the external rules, on the generator's output.
[{docs/reference/api.md,docs/tutorials/course/*.md}]
BasedOnStyles = Vale, Plain, write-good, alex, AiTells
Readability.FleschKincaid = NO
Readability.GunningFog = NO

# Internal text: the STE set, with the grade levels.
[{AGENTS.md,bench/*.md,.claude/*.md,.claude/**/*.md,architecture/*.md,architecture/**/*.md}]
BasedOnStyles = Vale, STE, Readability, write-good, alex, AiTells

# A dated log of measurements: not checked.
[bench/RESULTS.md]
BasedOnStyles =
