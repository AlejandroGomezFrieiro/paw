# paw's sample player: a CLAP plugin (`paw-sampler.clap`) and a command
# (`paw-sampler describe <file>`). Its own workspace, so that building paw
# never compiles it; extensions/sampler/nix builds it.
[package]
name = "paw-sampler"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "paw's sample player: SFZ and Decent Sampler instruments as a CLAP plugin"

[lib]
name = "paw_sampler"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "paw-sampler"
path = "src/bin/paw-sampler.rs"

[dependencies]
clap-sys = "0.5"
# The command line of the paw-sampler binary.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# Typed errors for the readers.
thiserror = "2"
# Errors of the binary.
anyhow = "1"
# WAV samples: the format and the data. The `smpl` chunk (key, loop) is read here.
hound = "3"
roxmltree = "0.21"
serde_json = "1"
# FLAC and Ogg Vorbis samples (MPL-2.0).
symphonia = { version = "0.6", default-features = false, features = ["flac", "ogg", "vorbis"] }

[workspace]

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 1

[dev-dependencies]
# Fails a test when the audio thread allocates.
assert_no_alloc = { version = "1", default-features = false, features = ["warn_debug", "warn_release"] }
# FLAC fixtures for the tests.
flacenc = { version = "0.5", default-features = false }
